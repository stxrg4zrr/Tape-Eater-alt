name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o "$(ls mixtape_deck_final*.zip | sort | tail -1)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash setup.sh
        working-directory: mixtape_deck
      - run: flutter build apk --release
        working-directory: mixtape_deck
      - uses: actions/upload-artifact@v4
        with:
          name: mixtape-apk
          path: mixtape_deck/build/app/outputs/flutter-apk/app-release.apk
